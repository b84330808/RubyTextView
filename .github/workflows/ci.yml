name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build, unit tests and lint
        run: ./gradlew --no-scan --stacktrace build

      - name: Compare JVM screenshots with the goldens (Roborazzi)
        run: ./gradlew --no-scan --stacktrace :rubytext-compose:verifyRoborazziDebug

      - name: Draw layout previews with java.awt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          ./gradlew --no-scan :rubytext-core:renderPreviews

      - name: Publish to Maven Local (what JitPack runs)
        run: ./gradlew --no-scan publishToMavenLocal -PVERSION_NAME=2.0.0-ci

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            rubytext-compose/build/outputs/roborazzi
            rubytext-core/build/previews
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: '**/build/reports'
